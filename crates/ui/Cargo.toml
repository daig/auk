[package]
name = "auk-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cssparser = "0.38"
selectors = "0.41"
precomputed-hash = "0.1"
taffy = { version = "0.14", default-features = false, features = ["std", "flexbox", "grid", "block_layout", "calc", "content_size"] }
parley = "0.11"
vello = "0.11"
skrifa = "0.44"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

# On Linux (the daemon), load fontconfig at run time instead of linking it, so building needs
# no fontconfig headers; the daemon parses CSS but never enumerates fonts.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }

[dev-dependencies]
# The probe pages, the WebKit tool and the box comparison, shared with the `layout` suite.
auk-conformance = { path = "../conformance" }
serde_json.workspace = true
pollster = "0.4"

[lints]
workspace = true
