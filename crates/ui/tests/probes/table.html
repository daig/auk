<!DOCTYPE html>
<html><head><style>
@font-face { font-family: Ahem; src: url(Ahem.ttf); }
html { font: 10px/1 Ahem; }
body { margin: 8px; }
table { margin-bottom: 6px; }
.b td, .b th { border: 1px solid; }
.p td { padding: 4px 6px; }
.w300 { width: 300px; }
.s0 { border-spacing: 0; }
.s5 { border-spacing: 5px 3px; }
.tb { border: 2px solid; padding: 3px; }
.fixedcol { width: 80px; }
.tall { height: 40px; }
.top td { vertical-align: top; }
th { font-weight: normal; }
</style></head>
<body>
<table><tr><td>a</td><td>bb</td><td>ccc</td></tr><tr><td>dddd</td><td>e</td><td>f</td></tr></table>
<table class="b"><tr><th>head one</th><th>two</th></tr><tr><td>cell</td><td>longer cell text</td></tr></table>
<table class="w300 b"><tr><td>a</td><td>bb</td><td>ccc</td></tr></table>
<table class="w300 b"><tr><td class="fixedcol">x</td><td>auto</td></tr></table>
<table class="p s0 b"><tr><td>pad</td><td>ded</td></tr></table>
<table class="s5 tb"><tr><td>x</td><td>y</td></tr><tr><td>z</td><td>w</td></tr></table>
<table class="b"><tr><td colspan="2">spanning two columns of text</td><td>c</td></tr><tr><td>a</td><td>b</td><td>c</td></tr></table>
<table class="b"><tr><td rowspan="2"><div style="height:40px">tall</div></td><td>r1</td></tr><tr><td>r2</td></tr></table>
<table class="b"><thead><tr><th>h</th></tr></thead><tbody><tr><td>body</td></tr></tbody><tfoot><tr><td>foot</td></tr></tfoot></table>
<table class="b"><tr class="tall"><td>tall row</td><td>x</td></tr></table>
<table class="b w300"><tr><td>wrapping text inside a table cell that must wrap</td><td>short</td></tr></table>
<table class="b"><tr><td>a</td><td><div style="width:50px;height:30px"></div></td></tr></table>
<table class="b top"><tr><td>top</td><td><div style="height:30px">x</div></td></tr></table>
<div style="width:200px"><table class="b"><tr><td>a table in a narrow container with long text content</td></tr></table></div>
<table class="b" style="width:100%"><tr><td>full</td><td>width</td></tr></table>
</body></html>
