[package]
name = "auk-term"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
# Widths are part of the replicated state (§15.2): every replica must use the same tables.
unicode-width = "=0.2.2"

[dev-dependencies]
alacritty_terminal = "0.26.0"
proptest = "1.11.0"
# The SDK's key decoder is what programs use to read keys; input tests decode with it.
tern-sdk = { path = "../../third_party/tern-sdk/rust" }

[lints]
workspace = true
