[package]
name = "auk-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["runtime"]
# The Luau runtime: VMs, budgets, workers and the host. Without it the crate is the manifest,
# discovery and catalog data only, which builds for wasm32 (replicas receive the catalog).
runtime = ["dep:mlua", "dep:crossbeam-channel", "dep:tracing"]

[dependencies]
mlua = { version = "0.12.2", features = ["luau", "luau-jit", "vendored", "serde"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1.7"
crossbeam-channel = { version = "0.5.17", optional = true }
tracing = { version = "0.1.44", optional = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "vm"
required-features = ["runtime"]

[[test]]
name = "host"
required-features = ["runtime"]

[[example]]
name = "s5_overheads"
required-features = ["runtime"]

[lints]
workspace = true
