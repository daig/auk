[package]
name = "auk-app"
description = "The macOS app (spec §19, §22): windows on daemon sessions, the sessions UI, input routing and the automation endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
auk-daemon = { path = "../daemon" }
auk-mirror = { path = "../mirror" }
auk-replica = { path = "../replica" }
auk-term = { path = "../term" }
serde_json.workspace = true
shlex = "2.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
accesskit = "0.25.1"
auk-platform-macos = { path = "../platform-macos" }
auk-remote = { path = "../remote" }
auk-render = { path = "../render" }
auk-text = { path = "../text" }
auk-tsp = { path = "../tsp" }
auk-ui = { path = "../ui" }
auk-views = { path = "../views" }
base64 = "0.23.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
