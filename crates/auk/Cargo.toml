[package]
name = "auk"
description = "The Auk binary: the macOS app, the session daemon and the CLI, as subcommands (spec §19)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
auk-app = { path = "../app" }
auk-cli = { path = "../cli" }
auk-web = { path = "../web" }
auk-daemon = { path = "../daemon" }
auk-plugins = { path = "../plugins" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
auk-conformance = { path = "../conformance" }
auk-daemon = { path = "../daemon" }
auk-mirror = { path = "../mirror" }
auk-replica = { path = "../replica" }
# The omp suite encodes keys and reads documents and views like a window.
auk-term = { path = "../term" }
auk-tsp = { path = "../tsp" }
auk-views = { path = "../views" }
serde_json.workspace = true
# The SDK's chunker and input parser are the program-side oracles in the tsp suite.
tern-sdk = { path = "../../third_party/tern-sdk/rust" }
base64 = "0.23.1"
sha2 = "0.11.0"

[lints]
workspace = true
