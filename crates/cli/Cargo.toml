[package]
name = "auk-cli"
description = "The auk CLI verbs, the control-endpoint client and the headless window (spec §11)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
auk-daemon = { version = "0.0.0", path = "../daemon" }
auk-plugins = { version = "0.0.0", path = "../plugins", default-features = false }
auk-mirror = { version = "0.0.0", path = "../mirror" }
auk-remote = { version = "0.0.0", path = "../remote" }
auk-render = { version = "0.0.0", path = "../render" }
auk-replica = { version = "0.0.0", path = "../replica" }
auk-term = { version = "0.0.0", path = "../term" }
auk-text = { version = "0.0.0", path = "../text" }
auk-tsp = { version = "0.0.0", path = "../tsp" }
auk-ui = { version = "0.0.0", path = "../ui" }
auk-views = { version = "0.0.0", path = "../views" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json.workspace = true
shlex = "2.0.1"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true
