[package]
name = "auk-conformance"
description = "Conformance suites: the TSP checklist, SDK runs, omp recordings, determinism fuzzing and goldens (spec §21)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The SDK's input parser is the program-side oracle for what the terminal writes.
tern-sdk = { path = "../../third_party/tern-sdk/rust" }
# The reference grid for the terminal suite (spec §21), the same version auk-term tests against.
alacritty_terminal = "0.26.0"
auk-term = { path = "../term" }
# A test window on the daemon's wire (`viewer`), with a follower replica per pane.
auk-mirror = { path = "../mirror" }
auk-replica = { path = "../replica" }
# The layout suite's renderer: TSP state projected through the views into the UI engine.
auk-tsp = { path = "../tsp" }
auk-ui = { path = "../ui" }
auk-views = { path = "../views" }
base64 = "0.23.1"
# Decodes WebDriver screenshots in the web suite.
png = "0.18.1"
# Encodes the perf suite's big pictures (the views decode them).
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
