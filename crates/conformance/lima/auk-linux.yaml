# The Linux VM for the `remote` suite: it builds and runs Auk's Linux daemon, and the
# suite attaches to it with `ssh … auk attach --stdio`. Create with:
#   limactl create --name auk-linux crates/conformance/lima/auk-linux.yaml
base: template:ubuntu-24.04
vmType: vz
cpus: 6
memory: 8GiB
disk: 40GiB
mounts:
  - location: "~/code/tern-clone"
    writable: false
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y build-essential clang cmake pkg-config zsh curl git
  - mode: user
    script: |
      #!/bin/sh
      set -eu
      if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
        curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
      fi
