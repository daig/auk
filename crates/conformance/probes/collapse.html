<!DOCTYPE html>
<html><head><style>
@font-face { font-family: Ahem; src: url(Ahem.ttf); }
html { font: 10px/1 Ahem; }
body { margin: 8px; }
table { border-collapse: collapse; margin-bottom: 6px; }
td, th { border: 1px solid; padding: 2px 4px; font-weight: normal; }
.thick td { border-width: 3px; }
.tb { border: 4px solid; }
.mix td:first-child { border-right-width: 5px; }
</style></head>
<body>
<table><tr><td>a</td><td>bb</td></tr><tr><td>ccc</td><td>d</td></tr></table>
<table class="thick"><tr><td>a</td><td>bb</td></tr><tr><td>ccc</td><td>d</td></tr></table>
<table class="tb"><tr><td>a</td><td>bb</td></tr></table>
<table class="mix"><tr><td>a</td><td>bb</td></tr><tr><td>c</td><td>d</td></tr></table>
<table style="width:200px"><thead><tr><th>h1</th><th>h2</th></tr></thead><tbody><tr><td>x</td><td>y</td></tr></tbody></table>
</body></html>
