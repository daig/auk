[package]
name = "auk-views"
description = "TSP kinds as UI components, chrome widgets and the built-in stylesheets (spec §8, §18.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
auk-ui = { path = "../ui" }
auk-tsp = { path = "../tsp" }
auk-term = { path = "../term" }
# The bundled Nerd Fonts symbols face that draws icon spans (§18.3).
auk-text = { path = "../text" }
serde_json = { workspace = true, features = ["preserve_order"] }
# `data:` URLs in plugin sheets' `background-image` (§9.8 CSS).
base64 = "0.23.1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
imara-diff = "0.2"
vello = "0.11"
# Making a supplied font every generic family, where there are no system fonts (the browser).
parley = "0.11"
# `image` (§8.5, §18.4): PNG (and APNG), JPEG, GIF and WebP, animated frames included.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Sanitized SVG: parsed and filtered to the allowlist (usvg's roxmltree), drawn by resvg.
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
# Mermaid fences in `md` (§8.5, §18.4, A23): parse, layout and SVG in Rust, drawn by resvg.
merman = { version = "=0.8.0", default-features = false, features = ["svg", "diagram-flowchart", "diagram-sequence", "diagram-class", "diagram-state", "diagram-er", "diagram-gantt", "diagram-pie"] }
# Advances of the face diagram text draws with, for merman's text measurement.
skrifa = "0.44"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
auk-conformance = { path = "../conformance" }
base64 = "0.23.1"
# Writes the APNG the image tests decode.
png = "0.18.1"
# Blocks on wgpu's adapter and device requests in the paint tests.
pollster = "0.4"

[lints]
workspace = true
