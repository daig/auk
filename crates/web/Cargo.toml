[package]
name = "auk-web"
description = "The browser client (wasm on WebGPU) and `auk web serve`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
auk-mirror = { path = "../mirror" }
auk-plugins = { path = "../plugins", default-features = false }
auk-replica = { path = "../replica" }
auk-term = { path = "../term" }
auk-tsp = { path = "../tsp" }
auk-ui = { path = "../ui" }
auk-views = { path = "../views" }
serde = { workspace = true }
serde_json.workspace = true
vello = "0.11"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

# The browser client. wasm-bindgen is pinned exactly: the JS glue is generated by the
# wasm-bindgen CLI, which must be the same version (the web suite installs it from Cargo.lock).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
auk-render = { path = "../render" }
auk-text = { path = "../text" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
raw-window-handle = "0.6.2"
web-sys = { version = "0.3.106", features = [
    "BinaryType",
    "Clipboard",
    "ClipboardEvent",
    "CloseEvent",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "DomTokenList",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "Response",
    "UrlSearchParams",
    "WebSocket",
    "WheelEvent",
    "Window",
] }

# `auk web serve`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
auk-daemon = { path = "../daemon" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3.4"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "signal", "time"] }

[lints]
workspace = true
