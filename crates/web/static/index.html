<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auk</title>
<style>
  html, body { margin: 0; height: 100%; background: #16181a; overflow: hidden; }
  @media (prefers-color-scheme: light) { html, body { background: #fbfbfa; } }
  /* The canvas fills the page; the tab bar is the app's chrome, drawn on it. */
  #screen { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
  /* The chrome's roles for assistive technology, mirrored offscreen. */
  #chrome-a11y { position: fixed; left: -10000px; top: 0; width: 1px; height: 1px; overflow: hidden;
                 pointer-events: none; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); max-width: 36em;
           padding: 8px 14px; border-radius: 8px; background: #2a2d30; color: #e6e8ea;
           font: 13px -apple-system, system-ui, sans-serif; box-shadow: 0 4px 16px #0006;
           opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.shown { opacity: 1; }
  #toast[data-level="error"] { background: #5a1d1d; }
  #toast .sub { font-family: ui-monospace, monospace; font-size: 11px; opacity: .75;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Keyboard and IME input land here; it follows the cursor so IME popups sit next to it. */
  #input { position: fixed; left: 0; top: 0; width: 1px; height: 1em; opacity: 0; border: 0;
           padding: 0; resize: none; outline: none; overflow: hidden; caret-color: transparent; }
  #status { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); max-width: 36em;
            font: 14px -apple-system, system-ui, sans-serif; color: #c5c8c6; text-align: center;
            white-space: pre-wrap; }
  #status:empty { display: none; }
  @media (prefers-color-scheme: light) {
    #status { color: #1f2328; }
  }
</style>
</head>
<body>
<div id="chrome-a11y" role="toolbar" aria-label="Tabs"></div>
<canvas id="screen"></canvas>
<textarea id="input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"
          aria-label="Terminal input"></textarea>
<div id="status">Loading…</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/boot.js"></script>
</body>
</html>
