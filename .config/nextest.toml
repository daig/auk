# Test-runner settings for scripts/verify.sh (GOAL.md). They're part of the gate: don't loosen them
# to make a test pass.
#
# nextest rejects any filter that matches no test binary, so add a suite's overrides (a longer
# timeout it really needs, the `screen` group) only once the suite exists.

[profile.default]
# A test still running after 5 minutes is killed and fails, so a hang can't stall the loop.
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
# Suites that drive GUI apps or Safari, or post key events, take turns: give them this group.
screen = { max-threads = 1 }

# The remote suite may start the Lima VM and build the Linux `auk` inside it first (GOAL.md).
[[profile.default.overrides]]
filter = 'binary_id(auk::remote)'
slow-timeout = { period = "60s", terminate-after = 15 }

# The signed-bundle test builds Auk.app (release auk, the wasm client, the wasm-bindgen CLI) in a
# target dir of its own, from cold the first time.
[[profile.default.overrides]]
filter = 'binary_id(auk::plugins) & test(=s5_jit_runs_in_the_signed_app_bundle)'
slow-timeout = { period = "60s", terminate-after = 15 }

# The web suite drives Safari through safaridriver.
[[profile.default.overrides]]
filter = 'binary_id(auk::web)'
test-group = 'screen'

# The app suite opens app windows, takes focus and selects input sources.
[[profile.default.overrides]]
filter = 'binary_id(auk::app)'
test-group = 'screen'

# The perf suite opens app windows, launches Ghostty and watches the screen.
[[profile.default.overrides]]
filter = 'binary_id(auk::perf)'
test-group = 'screen'

# The plugins suite's window-half tests run in the app.
[[profile.default.overrides]]
filter = 'binary_id(auk::plugins) & (test(/^m9_/) | test(/^ac14_window_/))'
test-group = 'screen'

# The app suite's remote window test may start the Lima VM and build the Linux `auk` in it first,
# as the remote suite does.
[[profile.default.overrides]]
filter = 'binary_id(auk::app) & test(/^remote_window_/)'
slow-timeout = { period = "60s", terminate-after = 15 }
