[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["third_party"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Line tables only: backtraces keep file and line, without full debug info. We debug from tests,
# logs and backtraces, never a debugger, and full debug info on macOS leaves per-codegen-unit object
# files in target/ that cargo never removes.
[profile.dev]
debug = "line-tables-only"

# Optimize dependencies in dev builds. Luau, wgpu and Vello at -O0 are slow enough to trip plugin
# budgets and skew rendering in debug test runs; our own crates stay unoptimized for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2

# Line numbers in backtraces from release test runs (scripts/verify.sh runs everything in release).
[profile.release]
debug = "line-tables-only"

# Mermaid is off the frame path: build its engine for size, not speed (about half its
# code in the browser client).
[profile.release.package.merman-core]
opt-level = "s"
[profile.release.package.merman-render]
opt-level = "s"
[profile.release.package.lol_html]
opt-level = "s"
